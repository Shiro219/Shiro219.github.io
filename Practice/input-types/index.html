<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Input Types</title>
</head>
<body>
    <h1> Page Styles </h1>

    <label>
        Text Color:
        <input id="textColor" type="text" placeholder="Text Color">
    </label>
    <button id="textColorBtn"> Change Text Color </button>
    <hr>
    <label> 
        <select id="bgColor">
            <option> Red </option>
            <option> yellow </option>
            <option> Blue </option>
            

        </select>
        <button id="bgColorBtn"> Change BackGround Color </button>
    </label>
    

    <hr>
    <label>
        Text Size:
        <input id="textSize" type="number" min="1" max="3" step="0.1" placeholder="Text Size">
    </label>
    <button id="textSizeBtn"> Change Text Size </button>

    



    <script src="jv/script.js"></script>
    
</body>
</html>
