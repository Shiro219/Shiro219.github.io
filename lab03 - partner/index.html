    <h1> Are you smarter than a 1st Grader? </h1>

    <div id="questionOne"> 1. What CSS property changes the text color? </div> <!-- name attribute only for radio buttons -->

    </label>
    <label>
        <input type="radio" name="q1" value="Font-Color"> Font-Color
    </label>
    <label>
        <input type="radio" name="q1" value="color"> color
    </label>

    <br>

    <div id="questionTwo"> 2. What's in the sky and is colored yellow? </div>

    <label>
        <input type="checkbox" id="q2a" value="bird"> A bird
    </label>
    <label>
        <input type="checkbox" id="q2b" value="sun"> The Sun
    </label>
    <label>
        <input type="checkbox" id="q2c" value="plane"> A plane
    </label>

    <br>

    <div  id="questionThree"> 3. What is 3 + 3? </div>
    <label>
        <input id="mathQ" type="number" min="0" max="10" step="1">
    </label>

    <!--
    <div> 3. What CSS property changes the text color? </div>

        <option value="brown">Brown</option>
